<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="EasyFarm local marketplace workspace">
<title>EasyFarm Marketplace</title>
<link rel="preload" href="assets/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="EasyFarm landing page"><span aria-hidden="true"></span>EasyFarm</a>
    <div id="farm-context" hidden></div>
    <button type="button" class="mobile-menu" aria-expanded="false" aria-controls="app-nav">Workspace menu <span aria-hidden="true">☰</span></button>
    <nav id="app-nav" aria-label="Workspace navigation"></nav>
    <div class="sidebar-bottom"><span class="workspace-person">EasyFarm demo</span><a href="/">Back to EasyFarm</a><span>Sample farms · shared demo data</span></div>
  </aside>
  <main>
    <header class="workspace-bar">
      <div><span id="workspace-role"></span><h1 id="view-title">Marketplace</h1></div>
      <div class="switcher" aria-label="Workspace role"><button type="button" data-role="buyer">Buyer</button><button type="button" data-role="grower">Grower</button></div>
    </header>
    <div id="notice" role="status" hidden></div>
    <div id="content" class="content" aria-busy="true"></div>
  </main>
  <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile workspace navigation"></nav>
</div>
<dialog id="editor" aria-labelledby="editor-title">
  <form id="editor-form">
    <div class="dialog-heading"><h2 id="editor-title"></h2><button type="button" id="close-editor" aria-label="Close editor">×</button></div>
    <div id="fields" class="fields"></div>
    <p id="editor-error" role="alert" hidden></p>
    <button class="primary" id="save-editor" type="submit">Save</button>
  </form>
</dialog>
<script src="app.js" defer></script>
</body>
</html>
